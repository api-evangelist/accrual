name: Accrual
description: 'Accrual is an augmented accounting intelligence platform for accounting
  firms and growing service businesses, offering what it calls the complete accounting
  workspace spanning engagement management, document intake, data processing, tax
  return generation, assurance workflows, and client collaboration. Backed by General
  Catalyst, the company emphasizes secure, US-hosted infrastructure with AES-256 encryption
  at rest, TLS in transit, data isolation, and SOC 2 Type II attestation, and states
  that customer data is not used to train AI models. Accrual does not publish a public
  API or developer program at this time; this profile captures the company identity
  and its published security posture.'
